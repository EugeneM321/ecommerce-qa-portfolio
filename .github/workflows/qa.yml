name: E-commerce QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Create reports directory
        run: |
          mkdir -p "$RUNNER_TEMP/qa-reports"
          echo "QA_REPORT_DIR=$RUNNER_TEMP/qa-reports" >> "$GITHUB_ENV"

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run API and SQL validation
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination="$QA_REPORT_DIR/api-sql.xml" tests/*.test.mjs

      - name: Install Playwright Chromium and system dependencies
        run: npx playwright install --with-deps chromium --only-shell

      - name: Run headless Playwright UI regression
        id: ui
        run: npm run test:ui

      - name: Upload Playwright failure evidence
        if: ${{ failure() && steps.ui.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Summarize test results
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob
          import os
          from pathlib import Path
          from xml.etree import ElementTree

          print("### QA test results\n")
          reports = sorted(glob.glob(os.path.join(os.environ["QA_REPORT_DIR"], "*.xml")))
          if not reports:
              print("No test reports were produced. See the job log for setup errors.")
          for report in reports:
              cases = ElementTree.parse(report).getroot().findall(".//testcase")
              failed = sum(case.find("failure") is not None or case.find("error") is not None for case in cases)
              skipped = sum(case.find("skipped") is not None for case in cases)
              print(f"- {Path(report).name} — {len(cases)} cases, {failed} failed, {skipped} skipped")
          PY

      - name: Upload machine-readable test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: qa-test-reports
          path: ${{ env.QA_REPORT_DIR }}/*.xml
          if-no-files-found: ignore
          retention-days: 7
