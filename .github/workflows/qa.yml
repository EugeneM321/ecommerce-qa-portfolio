name: E-commerce QA

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run API and SQL validation
        run: node --test tests/api-sql.test.mjs

      - name: Install Playwright Chromium and system dependencies
        run: npx playwright install --with-deps chromium --only-shell

      - name: Run headless Playwright UI regression
        id: ui
        run: npm run test:ui

      - name: Upload Playwright failure evidence
        if: ${{ failure() && steps.ui.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
